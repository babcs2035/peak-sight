[project]
name = "backend"
version = "0.1.0"
description = "Django backend for Collect Map API"
requires-python = ">=3.12"
dependencies = [
    "django>=6.0.6",
    "djangorestframework>=3.17.1",
    "django-cors-headers>=4.9.0",
    "psycopg2-binary>=2.9.12",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "pillow>=12.2.0",
    "numpy>=2.4.6",
    "requests>=2.34.2",
    "inflection>=0.5.1",
    "uritemplate>=4.2.0",
    "drf-spectacular>=0.29.0",
    "scikit-learn>=1.9.0",
    "networkx>=3.6.1",
    "tqdm>=4.68.3",
    "openai>=2.43.0",
    "httpx>=0.28.1",
    "dotenv>=0.9.9",
    "geopy>=2.4.1",
    "redis>=8.0.0",
]

[tool.ruff]
line-length = 128

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = []

[tool.ruff.format]
quote-style = "double"
